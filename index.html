<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwipeClean</title>
  <p>Created by Radha Krishna ❤️</p>
<style>
body{background:#10172a;color:white;font-family:Arial;text-align:center;padding:20px}
h1{color:#8ba7ff;font-size:36px}
button{padding:15px 25px;margin:10px;border:0;border-radius:15px;font-size:17px;font-weight:bold}
#photo{max-width:100%;max-height:55vh;border-radius:20px}
.card{background:#202b43;padding:20px;border-radius:22px;margin:20px auto;max-width:400px}
</style>
</head>
<body>
<h1>✦ SwipeClean</h1>
<p>Your gallery. Your choice.</p>
<input type="file" id="files" accept="image/*" multiple>
<div class="card">
<img id="photo">
<h2 id="status">Choose your photos!</h2>
</div>
<button onclick="move(-1)">👈 Keep</button>
<button onclick="move(1)">Delete ✕</button>
<p id="count">Reviewed: 0</p>
<script>
let photos=[],i=0,reviewed=0;
document.getElementById("files").onchange=e=>{
photos=Array.from(e.target.files);
i=0;reviewed=0;show();
};
function show(){
if(i>=photos.length){
document.getElementById("photo").src="";
document.getElementById("status").innerText="All done! 🎉";
return;
}
document.getElementById("photo").src=URL.createObjectURL(photos[i]);
document.getElementById("status").innerText="Photo "+(i+1)+" of "+photos.length;
}
function move(direction){
if(i>=photos.length)return;
document.getElementById("status").innerText=direction===1?"Marked for deletion":"Kept!";
i++;reviewed++;
document.getElementById("count").innerText="Reviewed: "+reviewed;
show();
}
</script>
</body>
  <p>Created by Radha Krishna ❤️</p>
</html>
